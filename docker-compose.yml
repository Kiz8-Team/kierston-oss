# Local PostgreSQL and ClickHouse for Fastgate. Local development only:
# ports are bound to 127.0.0.1 and the default passwords are not secrets.
#
#   docker compose up -d
#   docker compose --env-file .env.local up -d   # passwords from .env.local
#
# Connection settings match .env.example. Fastgate creates the fastgate_static
# schema and the ClickHouse tables itself on first ingest.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kierston}
      POSTGRES_DB: city_data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d city_data"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kierston}
      CLICKHOUSE_DB: city_data
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  clickhouse-data:
